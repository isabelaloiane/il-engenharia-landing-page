<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5" />

    <!-- L-19: Título e descrição alinhados à oferta do Vértice -->
    <title>Diagnóstico Vértice, sem custo | IL Ambiental</title>
    <meta name="description" content="Saiba o que sua empresa precisa cumprir na área ambiental nos próximos 12 meses. Diagnóstico conduzido pela Eng. Florestal Isabela Loiane para empresas da Região Metropolitana de Belém." />

    <!-- L-19: Página de anúncio - não deve competir com o site nas buscas -->
    <meta name="robots" content="noindex, follow" />

    <!-- L-19: URL canônica -->
    <link rel="canonical" href="https://lp.ilambiental.com.br/" />

    <!-- Compartilhamento em redes sociais e WhatsApp -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://lp.ilambiental.com.br/" />
    <meta property="og:title" content="Diagnóstico Vértice, sem custo | IL Ambiental" />
    <meta property="og:description" content="Saiba o que sua empresa precisa cumprir na área ambiental nos próximos 12 meses. Engenheira Florestal Isabela Loiane, CREA-PA 1521301735." />
    <meta property="og:image" content="https://lp.ilambiental.com.br/opengraph.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Ícone -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <!-- Fontes: Comfortaa (títulos) + Poppins (corpo) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    -->
